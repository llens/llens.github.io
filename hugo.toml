baseURL = "https://llens.github.io/"
languageCode = "en-gb"
title = "Thomas Snell -- Software Engineer & Scientific Computing"
theme = "PaperMod"
[pagination]
  pagerSize = 10

# SEO
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = false
  minifyOutput = true

[params]
  env = "production"
  title = "Thomas Snell"
  description = "Blog by Thomas Snell -- Staff Software Engineer, physicist, and scientific computing enthusiast exploring quantum circuit optimization, evolutionary algorithms, and computational geophysics."
  keywords = ["quantum computing", "evolutionary algorithms", "quantum circuit optimization", "MAP-Elites", "NSGA-II", "quality-diversity", "DEAP", "machine learning"]
  author = "Thomas Snell"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  math = true

  [params.homeInfoParams]
    Title = "Thomas Snell"
    Content = """
Staff Software Engineer at [SoFi](https://www.sofi.com/) with a background in Physics \
([Oxford](https://www.ox.ac.uk/)) and a PhD in Computational Geophysics \
([Durham](https://www.durham.ac.uk/)). Passionate about scientific computing and finding \
elegant solutions to complex problems. Currently exploring quantum circuit optimization \
using evolutionary algorithms, multi-objective search, and quality-diversity methods.

[GitHub](https://github.com/llens) | [ORCID](https://orcid.org/0009-0006-2197-835X) | [LinkedIn](https://www.linkedin.com/in/tom-snell-59020540)
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/llens"

  [[params.socialIcons]]
    name = "orcid"
    url = "https://orcid.org/0009-0006-2197-835X"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # SEO: Open Graph and Twitter cards
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.editPost]
    URL = "https://github.com/llens/llens.github.io/edit/master/content"
    Text = "Suggest changes"
    appendFilePath = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# SEO: Sitemap configuration
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# SEO: Output formats (RSS, JSON search index)
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Menus
[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 20

[[menu.main]]
  identifier = "publications"
  name = "Publications"
  url = "/publications/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50

# Markdown rendering
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
